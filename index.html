<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Interativo - Tema Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tema-escuro">

    <div class="container">
        <button id="btn-tema" aria-label="Alternar Tema">
            <span id="icone-tema">🌙</span>
            <span id="texto-tema">Modo Escuro</span>
        </button>

        <main class="card">
            <div class="imagem-wrapper">
                <img src="https://picsum.photos/600/400" alt="Imagem de paisagem urbana" class="card-img">
            </div>
            
            <div class="card-conteudo">
                <span class="badge">Tecnologia</span>
                <h2>Explorando a Web Moderna</h2>
                <p>Aprender HTML, CSS e JavaScript é a base para construir experiências incríveis e interativas para os usuários.</p>
                
                <a href="#" class="btn-acao">Saiba Mais</a>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
