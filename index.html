<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Club Corinthians Paulista</title>
  
  <style>
    /* Variáveis do Tema Claro */
    :root {
      --cor-fundo: #f0f0f0;
      --cor-texto: #111111;
      --cor-card: #ffffff;
      --cor-borda: #cc0000;
      --cor-botao: #111111;
      --cor-texto-botao: #ffffff;
      --cor-link: #cc0000;
      --sombra: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    /* Variáveis do Tema Escuro */
    body.tema-escuro {
      --cor-fundo: #0a0a0a;
      --cor-texto: #f0f0f0;
      --cor-card: #181818;
      --cor-borda: #c5a059; /* Tom dourado */
      --cor-botao: #ffffff;
      --cor-texto-botao: #000000;
      --cor-link: #c5a059;
      --sombra: 0 4px 15px rgba(0, 0, 0, 0.7);
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .card {
      background-color: var(--cor-card);
      padding: 2rem;
      border-radius: 12px;
      border-top: 5px solid var(--cor-borda);
      box-shadow: var(--sombra);
      text-align: center;
      max-width: 350px;
      width: 100%;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .card h2 {
      margin-top: 0;
      letter-spacing: 1px;
    }

    .card a {
      color: var(--cor-link);
      font-weight: bold;
      text-decoration: none;
      transition: color 0.3s;
    }

    .card a:hover {
      text-decoration: underline;
    }

    .btn-tema {
      background-color: var(--cor-botao);
      color: var(--cor-texto-botao);
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.5rem;
      width: 100%;
      transition: background-color 0.3s, color 0.3s, transform 0.1s;
    }

    .btn-tema:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQVtzQbTQlgx47UUMDABa-6cdOge2MHhrb1VfAqQPMRS5pcTCxrKdJ2S2rOlYUCvCqmWhgmzzHQqWe6s1Q" alt="Escudo do Corinthians">
    <h2>Vai Corinthians!</h2>
    <p>Acompanhe todas as notícias no <a href="https://www.corinthians.com.br" target="_blank" rel="noopener noreferrer">site oficial do Timão</a>.</p>
    <button id="btnAlternar" class="btn-tema">Mudar para Tema Escuro</button>
  </div>

  <script>
    const botao = document.getElementById('btnAlternar');
    const corpo = document.body;

    botao.addEventListener('click', () => {
      corpo.classList.toggle('tema-escuro');

      if (corpo.classList.contains('tema-escuro')) {
        botao.textContent = 'Mudar para Tema Claro';
      } else {
        botao.textContent = 'Mudar para Tema Escuro';
      }
    });
  </script>

</body>
</html>
